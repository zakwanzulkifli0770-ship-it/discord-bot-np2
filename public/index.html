<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 { margin: 0 0 1rem 0; font-size: 2.5rem; }
        p { margin: 0.5rem 0; font-size: 1.2rem; }
        .status { 
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #10b981;
            border-radius: 20px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Discord Bot</h1>
        <p>Status: <span class="status" id="status">Checking...</span></p>
        <p>Owner: ZYR 👑</p>
    </div>
    
    <script type="module">
        import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@2.0.0/+esm';
        injectSpeedInsights();
        
        // Check bot status
        fetch('/api/index.js')
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').textContent = data.ok ? 'Online ✅' : 'Offline ❌';
            })
            .catch(() => {
                document.getElementById('status').textContent = 'Unknown ⚠️';
            });
    </script>
</body>
</html>
